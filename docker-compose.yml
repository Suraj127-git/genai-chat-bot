services:
  mongodb:
    image: mongo:7.0
    container_name: genai-mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chromadb:
    image: chromadb/chroma:0.5.20
    container_name: genai-chromadb
    ports:
      - "9001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - app-network
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: ../infra/docker/backend.Dockerfile
    container_name: genai-backend
    ports:
      - "9000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=medical_chatbot
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-to-something-secure-32chars}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - DEBUG=True
      - ALLOWED_ORIGINS=http://localhost:4000
      - MAX_UPLOAD_SIZE_MB=50
      - ALLOWED_FILE_TYPES=pdf,txt,doc,docx
    depends_on:
      mongodb:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/frontend.Dockerfile
    container_name: genai-frontend
    ports:
      - "4000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

volumes:
  mongodb_data:
  chroma_data:

networks:
  app-network:
    driver: bridge
