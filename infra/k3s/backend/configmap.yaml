apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: medical-backend
data:
  # External MongoDB connection
  MONGODB_URL: "mongodb://your-mongodb-host:27017"
  MONGODB_DB_NAME: "medical_chatbot"
  
  # External ChromaDB connection
  CHROMA_HOST: "your-chromadb-host"
  CHROMA_PORT: "8000"
  
  # Application settings
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "production"
  DEBUG: "False"
  
  # CORS settings (update with your domain)
  ALLOWED_ORIGINS: "https://your-domain.com"
  
  # File upload limits
  MAX_UPLOAD_SIZE_MB: "50"
  ALLOWED_FILE_TYPES: "pdf,txt,doc,docx"
