apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: medical-chatbot-ingress
  namespace: default
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # Frontend routes
    - match: Host(`your-domain.com`)
      kind: Rule
      services:
        - name: frontend-service
          namespace: medical-frontend
          port: 80
      middlewares:
        - name: headers-middleware
        - name: cors-middleware
    
    # Backend API routes
    - match: Host(`your-domain.com`) && PathPrefix(`/api/v1`)
      kind: Rule
      services:
        - name: backend-service
          namespace: medical-backend
          port: 8000
      middlewares:
        - name: headers-middleware
        - name: cors-middleware
        - name: ratelimit-middleware
  tls:
    certResolver: letsencrypt
