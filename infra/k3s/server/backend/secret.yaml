apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: medical-backend
type: Opaque
stringData:
  # CRITICAL: Replace these with actual values before deployment!
  # For production, use sealed secrets or external secret management
  
  GROQ_API_KEY: "your-groq-api-key-here"
  SECRET_KEY: "your-jwt-secret-key-min-32-chars-CHANGE-THIS"
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
